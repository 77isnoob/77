let currentFilter = 'all';

function loadData() {
  render();
}

function getBadgeClass(type) {
  const openTypes = ['公开招标', '竞争性磋商', '竞争性谈判', '询价公告', '单一来源'];
  const winTypes = ['中标公告', '成交公告'];
  if (openTypes.includes(type)) return 'open';
  if (winTypes.includes(type)) return 'win';
  return 'other';
}

function getBadgeLabel(type) {
  return type || '其他';
}

function render() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();

  let filtered = allData.filter(item => {
    // filter by type
    if (currentFilter !== 'all') {
      const bc = getBadgeClass(item.notice_type);
      if (bc !== currentFilter) return false;
    }
    // filter by search
    if (query) {
      const text = (item.title + ' ' + item.purchaser + ' ' + item.agent + ' ' + (item.search_keyword || '')).toLowerCase();
      if (!text.includes(query)) return false;
    }
    return true;
  });

  // Stats
  const openCount = allData.filter(i => getBadgeClass(i.notice_type) === 'open').length;
  const winCount = allData.filter(i => getBadgeClass(i.notice_type) === 'win').length;
  const otherCount = allData.length - openCount - winCount;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${allData.length}</div><div class="label">总计</div></div>
    <div class="stat-card"><div class="num green">${openCount}</div><div class="label">招标中</div></div>
    <div class="stat-card"><div class="num orange">${winCount}</div><div class="label">已中标</div></div>
    <div class="stat-card"><div class="num" style="color:#757575">${otherCount}</div><div class="label">其他</div></div>
  `;

  // Group by date
  const grouped = {};
  filtered.forEach(item => {
    const date = (item.publish_date || '').split(' ')[0] || '未知日期';
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(item);
  });

  const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

  const content = document.getElementById('content');
  document.getElementById('headerTime').textContent = `共 ${allData.length} 条记录 · ${sortedDates.length} 个日期 · 更新于 ${new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'})}`;

  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty">没有匹配的记录</div>';
    return;
  }

  let html = '';
  for (const date of sortedDates) {
    const items = grouped[date];
    html += `<div class="date-label">${date} <span class="count">${items.length} 条</span></div>`;
    for (const item of items) {
      const bc = getBadgeClass(item.notice_type);
      html += `
        <div class="card">
          <span class="badge ${bc}">${getBadgeLabel(item.notice_type)}</span>
          <div class="card-body">
            <div class="card-title">
              <a href="${item.url}" target="_blank" rel="noopener">${escHtml(item.title)}</a>
              ${item.search_keyword ? `<span class="card-keyword">${escHtml(item.search_keyword)}</span>` : ''}
            </div>
            <div class="card-meta">
              ${item.purchaser ? `<span>🏢 ${escHtml(item.purchaser)}</span>` : ''}
              ${item.agent ? `<span>🏗️ ${escHtml(item.agent)}</span>` : ''}
              ${item.publish_date ? `<span>📅 ${escHtml(item.publish_date)}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }
  }
  content.innerHTML = html;
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  render();
}

loadData();
</script>
